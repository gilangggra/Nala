name: Release (build check)

on:
  push:
    tags:
      - 'v*'

# Notarization is done locally with scripts/release.sh.
# This workflow only verifies the build compiles on a clean machine.
jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('NotchBuddy/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Resolve Swift package dependencies
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Resolving Swift package dependencies..."
            if xcodebuild -resolvePackageDependencies -project NotchBuddy/NotchBuddy.xcodeproj -scheme NotchBuddy; then
              echo "Package dependencies resolved successfully."
              break
            fi
            if [ $i -eq 5 ]; then
              echo "Failed to resolve package dependencies after 5 attempts."
              exit 1
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done

      - name: Build Release (no signing)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
